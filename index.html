<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Interactive Lucky Draw</title>
    <meta
      name="description"
      content="An interactive 3D lucky draw. Open your hand to burst the present, then grab a glowing ball to reveal the winner."
    />
    <meta name="theme-color" content="#0a2f1e" />

    <!-- Link preview (Open Graph): WhatsApp, Facebook, LinkedIn, Telegram, Slack, Discord -->
    <!-- __SITE_URL__ is replaced at build time (see siteUrlPlugin in vite.config.ts) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="3D Interactive Lucky Draw" />
    <meta property="og:title" content="3D Interactive Lucky Draw" />
    <meta
      property="og:description"
      content="Open your hand to burst the present, then grab a glowing ball to reveal the winner."
    />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Lucky Draw Session: a glowing red and gold particle present box"
    />

    <!-- Link preview for X (Twitter) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="3D Interactive Lucky Draw" />
    <meta
      name="twitter:description"
      content="Open your hand to burst the present, then grab a glowing ball to reveal the winner."
    />
    <meta name="twitter:image" content="__SITE_URL__/og-image.jpg" />
    <link rel="icon" type="image/svg+xml" href="/photos/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/photos/favicon.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap");

      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #6e796e; /* Deepest Green/Black */
      }

      /* Photo overlay animations */
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes scaleIn {
        from {
          transform: scale(0.8);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }

      .animate-fade-in {
        animation: fadeIn 0.3s ease-out;
      }

      .animate-scale-in {
        animation: scaleIn 0.4s ease-out;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
          "react/": "https://aistudiocdn.com/react@^19.2.0/",
          "react": "https://aistudiocdn.com/react@^19.2.0",
          "@react-three/fiber": "https://aistudiocdn.com/@react-three/fiber@^9.4.0",
          "three": "https://aistudiocdn.com/three@^0.181.2",
          "@react-three/postprocessing": "https://aistudiocdn.com/@react-three/postprocessing@^3.0.4",
          "@react-three/drei": "https://aistudiocdn.com/@react-three/drei@^10.7.7",
          "postprocessing": "https://aistudiocdn.com/postprocessing@^6.38.0",
          "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/+esm"
        }
      }
    </script>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
